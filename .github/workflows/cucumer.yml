name: Cucumber Tests

on:
    workflow_dispatch:   # only runs when manually triggered from the Actions tab
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

jobs:
  cucumber-regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber Regression
        run: npm run cucumberRegression

      - name: Upload Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-regression
          path: cucumber-report.html
          retention-days: 30

  cucumber-validation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber Validation
        run: npm run cucumberValidation

      - name: Upload Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-validation
          path: cucumber-report.html
          retention-days: 30