name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Check Azure Playwright version
        run: npm list @azure/playwright @playwright/test

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Playwright Service URL
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: |
          if [ -z "$PLAYWRIGHT_SERVICE_URL" ]; then
            echo "::error::PLAYWRIGHT_SERVICE_URL is not set"
            exit 1
          fi

          echo "PLAYWRIGHT_SERVICE_URL is configured"

      - name: Debug Playwright Service URL
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: |
          echo "Protocol: ${PLAYWRIGHT_SERVICE_URL%%:*}"
          echo "Length: ${#PLAYWRIGHT_SERVICE_URL}"

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: npx playwright test --config=playwright.service.config.js --workers=1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30